[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "active-falsification"
version = "0.1.0"
description = "Active Falsification: Learning Strategy Boundaries in Mathematical LLMs"
requires-python = ">=3.9"
dependencies = ["sympy>=1.12", "pyyaml>=6.0"]

[project.optional-dependencies]
models = ["torch>=2.1", "transformers>=4.51", "accelerate>=0.30", "sentencepiece>=0.1.99"]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
