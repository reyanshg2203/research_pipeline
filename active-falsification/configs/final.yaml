# Final configuration -- full precision, publication counts.

models:
  - qwen3_8b
  - deepseek_r1_llama_8b
  - smollm3_3b
  - llama32_3b          # replace with phi35_mini ONLY if access is blocked;
                        # phi35_mini is ~3.8B and must be labelled as such

precision: bf16_or_fp16
use_thinking: true

families:
  - order_minus_one
  - lte_valuation
  - recurrence_substitution

master_seed: 20260101
temperature: 0.6
top_p: 0.95
top_k: 20

calibration_per_tier: 10
seed_candidates: 14
seed_count: 6
h0_pilot_size: 30
active_rounds: 5
active_batch_size: 4
iid_test_size: 100
challenge_test_size: 50

# >= 3 stochastic repeats per model x family if time allows; if you reduce this,
# the paper must state the number of runs and must not overclaim (spec S.20).
adaptation_repeats: 3
passive_max_rounds: 60
balanced_tests: true
show_features_in_observations: false

max_new_tokens:
  solve: 2048
  induce: 1800
  query: 800
  revise: 1200
  classify: 500

# Active query schema: 'full' is the spec default. 'label_decoupled' removes
# the features that determine the oracle label (see scripts/audit_schema.py)
# and is the stronger, opt-in variant of the experiment.
active_schema_profile: full
