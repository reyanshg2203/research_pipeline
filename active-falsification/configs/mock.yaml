# Offline end-to-end pipeline test. Produces NO scientific results.

models:
  - mock
precision: none
use_thinking: false

families:
  - order_minus_one
  - lte_valuation
  - recurrence_substitution

master_seed: 20260101
calibration_per_tier: 2
seed_candidates: 8
seed_count: 6
h0_pilot_size: 8
active_rounds: 1
active_batch_size: 2
iid_test_size: 8
challenge_test_size: 6
adaptation_repeats: 1
passive_max_rounds: 6
balanced_tests: true

# The mock model answers at random, so no tier can pass the predeclared
# selection rule. Pin the tiers explicitly so this offline plumbing test can
# run end to end. NEVER do this for a real run.
override_difficulties:
  order_minus_one: easy
  lte_valuation: easy
  recurrence_substitution: easy

max_new_tokens:
  solve: 256
  induce: 256
  query: 128
  revise: 256
  classify: 32
